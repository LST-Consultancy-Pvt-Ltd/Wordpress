# Site Autopilot control plane (Next.js automation platform).
# Bridges run beside each managed Next.js site (see automation-bridge/README.md);
# to reach them over a private Docker network instead of HTTPS, also load
# docker-compose.bridges.yml.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - sa_mongo_data:/data/db

  backend:
    image: lstconsultancy/site-autopilot-backend:latest
    restart: unless-stopped
    depends_on:
      - mongo
    ports:
      - "8002:8000"
    environment:
      - MONGO_URL=mongodb://mongo:27017
      - DB_NAME=${DB_NAME:?set DB_NAME}
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:?set JWT_SECRET_KEY}
      # Fernet key; bridge credentials cannot be stored or used without it.
      - ENCRYPTION_KEY=${ENCRYPTION_KEY:?set ENCRYPTION_KEY}
      # Unattended writes (scheduled autopilot runs, auto-apply policies) stay
      # off unless explicitly set to 0.
      - AUTOMATION_WRITES_FROZEN=${AUTOMATION_WRITES_FROZEN:-1}
      - CORS_ORIGINS=${CORS_ORIGINS}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GOOGLE_SEARCH_API_KEY=${GOOGLE_SEARCH_API_KEY}
      - GOOGLE_SEARCH_CX=${GOOGLE_SEARCH_CX}
      - GOOGLE_ADS_DEVELOPER_TOKEN=${GOOGLE_ADS_DEVELOPER_TOKEN}
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET}
      - GOOGLE_REDIRECT_URI=${GOOGLE_REDIRECT_URI}
      - DATAFORSEO_LOGIN=${DATAFORSEO_LOGIN}
      - DATAFORSEO_PASSWORD=${DATAFORSEO_PASSWORD}
      - PAGESPEED_API_KEY=${PAGESPEED_API_KEY}

  frontend:
    image: lstconsultancy/site-autopilot-frontend:latest
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3007:80"

volumes:
  sa_mongo_data:
